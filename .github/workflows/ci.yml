name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./python/laix
      - name: Test
        working-directory: python/laix
        run: python -m pytest -q
      - name: Run examples
        run: |
          for file in $(find examples/python -name '*.py'); do
            python "$file"
          done

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        working-directory: typescript/laix
        run: npm test
      - name: Conformance
        working-directory: typescript/laix
        run: npm run conformance
      - name: Run examples
        run: |
          node --experimental-strip-types examples/typescript/attention/bill_due.mts
          node --experimental-strip-types examples/typescript/action/action.mts
          node --experimental-strip-types examples/typescript/records/record.mts
