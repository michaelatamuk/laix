name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check links
        run: python scripts/ci/check_docs_links.py

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff jsonschema
          python -m pip install -e ./packages/python/laix
      - name: Lint
        working-directory: packages/python/laix
        run: ruff check .
      - name: Test
        working-directory: packages/python/laix
        run: python -m pytest -q
      - name: Bench
        working-directory: packages/python/laix
        run: python -m laix.appkit.bench
      - name: Live bench v2
        run: bash scripts/novelty/reproduce.sh
      - name: Run examples
        run: |
          for file in $(find examples -name '*.py'); do
            python "$file"
          done

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        working-directory: packages/typescript/laix
        run: npm ci
      - name: Typecheck
        working-directory: packages/typescript/laix
        run: |
          npm run typecheck
          npm run typecheck:declarations
      - name: Test
        working-directory: packages/typescript/laix
        run: npm test
      - name: Bench
        working-directory: packages/typescript/laix
        run: npm run bench
      - name: Conformance
        working-directory: packages/typescript/laix
        run: npm run conformance
      - name: Live bench parity
        working-directory: packages/typescript/laix
        run: npm run live-bench
      - name: Run examples
        run: |
          for file in $(find examples/typescript -name '*.mts'); do
            node --experimental-strip-types "$file"
          done
