name: Bug report
description: Report a reproducible defect in LAIX.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove secrets, customer data and raw incident content before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal code, request, policy or benchmark case.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, tag or commit.
      placeholder: "0.13.1"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Python
        - TypeScript
        - Docs
        - Examples
        - Benchmarks
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Error, traceback, wrong decision or wrong result.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Environment, operating system and anything else that matters.
