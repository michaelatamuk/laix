[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laix"
version = "0.1.1"
description = "LAIX: one generic decision layer for live apps. Contracts, policies, runtime, execution, outcomes and decision records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["laix*"]

[tool.setuptools.package-data]
laix = ["schemas/*.json"]
"laix.attention" = ["contract/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
