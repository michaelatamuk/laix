<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="how-title how-desc">
  <title id="how-title">How LAIX works</title>
  <desc id="how-desc">An agent plans, LAIX decides, the host executes, and the outcome returns as the next decision. Commitments, attention budget, approvals, revisions and outcomes are carried forward.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="64" y="64" fill="#0F766E" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">DECISION LOOP</text>
  <text x="64" y="102" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="28" font-weight="700">One decision, carried forward</text>
  <text x="64" y="128" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="14">The agent plans. LAIX decides. The host executes. The outcome returns.</text>

  <path d="M 1070 276 C 1070 160, 470 160, 470 270" fill="none" stroke="#94A3B8" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="770" y="172" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12">next decision</text>

  <path d="M 170 300 H 1070" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 314 294 L 322 300 L 314 306" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 614 294 L 622 300 L 614 306" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 914 294 L 922 300 L 914 306" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="170" cy="300" r="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="170" cy="300" r="5" fill="#94A3B8"/>

  <circle cx="470" cy="300" r="40" fill="none" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="470" cy="300" r="30" fill="#0F766E"/>
  <rect x="461" y="291" width="18" height="18" rx="3" fill="#FFFFFF" transform="rotate(45 470 300)"/>

  <circle cx="770" cy="300" r="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="770" cy="300" r="5" fill="#94A3B8"/>

  <circle cx="1070" cy="300" r="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="1070" cy="300" r="5" fill="#94A3B8"/>

  <text x="170" y="352" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="17" font-weight="600">Agent plans</text>
  <text x="470" y="352" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="17" font-weight="600">LAIX decides</text>
  <text x="770" y="352" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="17" font-weight="600">Host executes</text>
  <text x="1070" y="352" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="17" font-weight="600">Outcome returns</text>

  <text x="170" y="376" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12.5">signals · options · constraints</text>
  <text x="470" y="376" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="11.5">wait · observe · guide · ask · act · verify · escalate</text>
  <text x="770" y="376" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12.5">approval · receipts · idempotency</text>
  <text x="1070" y="376" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12.5">result · calibration · audit</text>

  <line x1="64" y1="482" x2="1136" y2="482" stroke="#F1F5F9" stroke-width="1"/>
  <text x="64" y="512" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CARRIED FORWARD</text>

  <circle cx="250" cy="507" r="4" fill="#0F766E"/>
  <text x="263" y="512" fill="#334155" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13">commitments</text>
  <circle cx="370" cy="507" r="4" fill="#0F766E"/>
  <text x="383" y="512" fill="#334155" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13">attention budget</text>
  <circle cx="525" cy="507" r="4" fill="#0F766E"/>
  <text x="538" y="512" fill="#334155" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13">approvals</text>
  <circle cx="635" cy="507" r="4" fill="#0F766E"/>
  <text x="648" y="512" fill="#334155" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13">revisions</text>
  <circle cx="745" cy="507" r="4" fill="#0F766E"/>
  <text x="758" y="512" fill="#334155" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13">outcomes</text>
</svg>
