  <text x="64" y="58" fill="#0F766E" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">DECISION LAYERS</text>
  <text x="64" y="102" fill="#0F172A" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="30" font-weight="700">Seven layers, one decision contract</text>
  <text x="64" y="132" fill="#64748B" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="14" font-weight="400">From what crosses the boundary to what proves the choice.</text>
