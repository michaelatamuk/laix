<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="decision-title decision-desc">
  <title id="decision-title">Seven layers, one decision contract</title>
  <desc id="decision-desc">The seven decision layers: contract, domain, decision, sensing, learning, evaluation and foundation. The contract is at the top and the foundation at the bottom.</desc>
