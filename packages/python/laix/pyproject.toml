[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laix"
version = "0.9.0"
description = "LAIX: one generic decision layer for live apps. Decision shapes, policies, runtime, execution, outcomes and decision records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["laix*"]

[tool.setuptools.package-data]
"laix.core.schema" = ["*.json"]
"laix.core.engines.attention" = ["*.json"]
"laix.core.evaluation" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
