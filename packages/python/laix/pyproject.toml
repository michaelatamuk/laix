[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laix"
version = "0.13.0"
description = "LAIX: Live AI Experience. The decision layer for live AI experiences: decisions, timing, approval, audit and outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
laix = "laix.appkit.cli:main"
laix-mcp = "laix.appkit.mcp_server:main"

[project.urls]
Homepage = "https://github.com/michaelatamuk/laix"
Documentation = "https://github.com/michaelatamuk/laix/blob/main/docs/README.md"
Repository = "https://github.com/michaelatamuk/laix"
Issues = "https://github.com/michaelatamuk/laix/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["laix*"]

[tool.setuptools.package-data]
"laix" = ["py.typed"]
"laix.decision.schema" = ["*.json"]
"laix.decision.sensing.signals" = ["*.json"]
"laix.decision.evaluation.cases" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
